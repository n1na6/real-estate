        <h2>Përditëso Pronën</h2>
        <form action="" method="post" enctype="">
            <label for="property-type">Tipi i Pronës:</label>
            <select name="property-type" id="property-type" required>
                <option value="">Zgjedh Tipin</option>
                <option value="apartment">Apartament</option>
                <option value="house">Shtëpi</option>
                <option value="villa">Ville</option>
                <option value="land">Tokë</option>
                <option value="commercial">Pronë Komerciale</option>
            </select>

            
            <label for="size">Sipërfaqja:</label>
            <input type="text" id="size" name="size" required>

            <label for="price">Çmimi:</label>
            <input type="text" id="price" name="price" required>

            <label for="location">Lokacioni:</label>
            <input type="text" id="location" name="location" required>

            <label for="property-status">Statusi i Pronës:</label>
            <select name="property-status" id="property-status" required>
                <option value="">Zgjedh Statusin</option>
                <option value="for-sale">Në shitje</option>
                <option value="for-rent">Për Qira-marrje</option>
                <option value="sold">E shitur</option>
                <option value="">Nuk është në Dispozicion</option>
            </select>

            <label for="description">Përshkrimi:</label>
            <textarea id="description" name="description" rows="15" required></textarea>

            <label for="image">Përditëso Imazhe tjera:</label>
            <input type="file" id="image" name="image[]" accept="image/*" multiple>


            <button type="submit">Përditëso</button>
        </form>
